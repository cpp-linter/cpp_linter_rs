ci:
  autofix_prs: true
  autofix_commit_msg: 'chore: auto fixes from pre-commit.com hooks'
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(?:cpp-linter/tests/.*\.(?:patch|diff))|(?:\.yarn/releases/yarn.*js)'
      - id: end-of-file-fixer
        exclude: bindings/node/.*package\.json
      - id: check-docstring-first
      - id: check-added-large-files
        exclude: '^\.yarn/releases/yarn.*js|pypi_clang.*\.json$'
      - id: check-yaml
        exclude: docs/mkdocs.yml
      - id: check-toml
      - id: mixed-line-ending
        exclude: '^\.yarn/releases/yarn.*js'
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Run the python linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the python formatter.
      - id: ruff-format
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.2.0
    hooks:
      - id: cspell # Spell check changed files
